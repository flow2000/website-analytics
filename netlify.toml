[build]
  functions = "api"
  publish = "public"

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/export"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
