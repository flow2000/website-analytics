name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret 为空，请到 Settings → Secrets 配置"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret 为空，请到 Settings → Secrets 配置"; exit 1; }
          test -n "$EXPORT_KEY" || { echo "::error::EXPORT_KEY secret 为空，请到 Settings → Secrets 配置"; exit 1; }
          npx wrangler whoami

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set runtime secrets (API token + account id + export key)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
        run: |
          jq -n --arg t "$CLOUDFLARE_API_TOKEN" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg e "$EXPORT_KEY" \
            '{CLOUDFLARE_API_TOKEN:$t, CLOUDFLARE_ACCOUNT_ID:$a, EXPORT_KEY:$e}' > .cf-secrets.json
          ok=0
          for i in 1 2 3 4 5; do
            if npx wrangler secret bulk .cf-secrets.json; then ok=1; break; fi
            echo "::warning::secret bulk 失败（可能为 Worker 并发修改冲突），10s 后重试 ($i/5)"
            sleep 10
          done
          rm -f .cf-secrets.json
          [ "$ok" = "1" ] || { echo "::error::多次重试后 secret 设置仍失败"; exit 1; }
