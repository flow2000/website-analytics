name: Deploy Worker (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret 为空，请到 Settings → Secrets 配置"; exit 1; }
          test -n "${{ secrets.EXPORT_KEY }}" || { echo "::error::EXPORT_KEY secret 为空，请到 Settings → Secrets 配置"; exit 1; }
          npx wrangler whoami

      - name: Deploy to Cloudflare Workers (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Set runtime secrets (API token + export key)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
        run: |
          echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
          echo "$EXPORT_KEY" | npx wrangler secret put EXPORT_KEY
