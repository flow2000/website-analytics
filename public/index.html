<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>51.LA 流量趋势分析 · AI 报告</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-blue: #3b82f6;
    --accent-green: #22c55e;
    --accent-yellow: #eab308;
    --accent-red: #ef4444;
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --border-color: #334155;
    --card-bg: #1e293b;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }
  [data-theme="light"] {
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --card-bg: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }
  /* Header */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header-title {
    font-size: 19px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-subtitle { font-size: 12px; color: var(--text-muted); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn {
    padding: 8px 16px;
    border: none; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-secondary {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border-color);
  }
  .btn-secondary:hover { background: var(--border-color); }
  .icon-btn {
    width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--bg-tertiary); border: 1px solid var(--border-color);
    color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--border-color); color: var(--text-primary); }
  /* Container */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  /* Report Info Bar */
  .report-info-bar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px; padding: 10px 16px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 10px; font-size: 13px;
    flex-wrap: wrap;
  }
  .report-info-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }
  .report-info-indicator.stale {
    background: var(--accent-yellow);
    box-shadow: 0 0 8px var(--accent-yellow);
  }
  .report-info-indicator.expired {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
  }
  .report-info-text { color: var(--text-secondary); }
  .report-info-text strong { color: var(--text-primary); }
  .report-info-spacer { flex: 1; }
  /* Site Selector */
  .site-selector {
    display: flex; gap: 12px; margin-bottom: 20px;
    flex-wrap: wrap; align-items: center;
  }
  .site-tabs {
    display: flex; gap: 6px;
    background: var(--bg-secondary);
    padding: 4px; border-radius: 10px;
    border: 1px solid var(--border-color);
  }
  .site-tab {
    padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-secondary); transition: all 0.2s;
    border: none; background: transparent;
  }
  .site-tab:hover { color: var(--text-primary); }
  .site-tab.active { background: var(--accent-blue); color: white; }
  /* Stats Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px; padding: 18px;
    transition: all 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .stat-label {
    font-size: 12px; color: var(--text-secondary);
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .stat-value { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .stat-change { font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .stat-change.up { color: var(--accent-green); }
  .stat-change.down { color: var(--accent-red); }
  .stat-change.flat { color: var(--text-muted); }
  .stat-icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 10px;
  }
  .icon-uv { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
  .icon-pv { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
  .icon-ip { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
  .icon-duration { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); }
  .icon-bounce { background: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }
  .icon-newuser { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
  /* Chart Section */
  .chart-section {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .section-title {
    font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .metric-toggle { display: flex; gap: 6px; }
  .metric-btn {
    padding: 5px 10px; font-size: 12px;
    background: var(--bg-tertiary); color: var(--text-secondary);
    border: 1px solid var(--border-color); border-radius: 6px;
    cursor: pointer; transition: all 0.2s;
  }
  .metric-btn:hover { color: var(--text-primary); }
  .metric-btn.active {
    background: var(--accent-blue); color: white; border-color: var(--accent-blue);
  }
  .chart-container { position: relative; height: 300px; }
  .chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) {
    .chart-row { grid-template-columns: 1fr; }
  }
  /* Quality Indicators */
  .quality-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .quality-item {
    text-align: center; padding: 14px;
    background: var(--bg-tertiary); border-radius: 10px;
  }
  .quality-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .quality-value { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .quality-level {
    display: inline-block; padding: 2px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .level-excellent { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
  .level-good { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
  .level-normal { background: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }
  .level-poor { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
  /* AI Analysis Section */
  .ai-section {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px; padding: 24px; margin-bottom: 20px;
  }
  .ai-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .ai-badge {
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
    color: white; padding: 4px 12px;
    border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .ai-badge.pending {
    background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange, #f97316));
  }
  .ai-summary {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(168, 85, 247, 0.1));
    border: 1px solid var(--border-color);
    border-radius: 10px; padding: 18px;
    margin-bottom: 18px; font-size: 14px; line-height: 1.8;
  }
  .ai-findings {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .finding-card {
    background: var(--bg-tertiary); border-radius: 10px;
    padding: 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .finding-icon { font-size: 22px; flex-shrink: 0; }
  .finding-text { font-size: 13px; line-height: 1.6; }
  .ai-tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
  }
  .ai-tab {
    padding: 10px 18px; cursor: pointer;
    font-size: 14px; font-weight: 500;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all 0.2s;
    white-space: nowrap;
  }
  .ai-tab:hover { color: var(--text-primary); }
  .ai-tab.active {
    color: var(--accent-blue);
    border-bottom-color: var(--accent-blue);
  }
  .ai-panel { display: none; }
  .ai-panel.active { display: block; }
  .rec-item {
    display: flex; gap: 12px;
    padding: 14px;
    background: var(--bg-tertiary); border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid var(--accent-blue);
  }
  .rec-item.type-success { border-left-color: var(--accent-green); }
  .rec-item.type-warning { border-left-color: var(--accent-yellow); }
  .rec-item.type-alert { border-left-color: var(--accent-red); }
  .rec-item.type-info { border-left-color: var(--accent-blue); }
  .rec-title { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  .rec-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .rec-icon { font-size: 20px; flex-shrink: 0; }
  .rec-priority {
    display: inline-block; padding: 2px 8px;
    border-radius: 4px; font-size: 11px; font-weight: 600;
    margin-left: 8px;
    background: rgba(59, 130, 246, 0.2); color: var(--accent-blue);
  }
  .rec-priority.high { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
  .rec-priority.medium { background: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); }
  .rec-priority.low { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
  .ai-outlook {
    background: var(--bg-tertiary); border-radius: 10px;
    padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start;
  }
  .outlook-label { font-weight: 600; color: var(--accent-cyan); white-space: nowrap; }
  /* Deep Analysis */
  .deep-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .deep-card {
    background: var(--bg-tertiary); border-radius: 10px; padding: 16px;
  }
  .deep-card-title {
    font-size: 13px; font-weight: 600;
    color: var(--accent-blue); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .deep-card-content { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .action-list { list-style: none; }
  .action-list li {
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    display: flex; gap: 10px;
  }
  .action-list li:last-child { border-bottom: none; }
  .action-phase {
    flex-shrink: 0; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
    background: rgba(59, 130, 246, 0.2); color: var(--accent-blue);
    height: fit-content;
  }
  .risk-list { list-style: none; }
  .risk-list li {
    padding: 8px 0; font-size: 13px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .risk-icon { color: var(--accent-red); flex-shrink: 0; }
  /* Strategy Section */
  .strategy-card {
    background: var(--bg-tertiary); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
    border: 1px solid var(--border-color);
  }
  .strategy-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .strategy-target {
    font-size: 18px; font-weight: 700;
  }
  .strategy-type {
    padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: white;
  }
  .strategy-focus {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 14px;
  }
  .strategy-actions { list-style: none; }
  .strategy-actions li {
    padding: 8px 0; font-size: 13px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .strategy-actions li::before {
    content: '✓'; color: var(--accent-green); font-weight: 700;
  }
  /* Comparison Table */
  .comparison-table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  .comparison-table th, .comparison-table td {
    padding: 12px 16px; text-align: left;
    border-bottom: 1px solid var(--border-color);
  }
  .comparison-table th {
    font-weight: 600; color: var(--text-secondary);
    font-size: 13px; background: var(--bg-tertiary);
  }
  .comparison-table tr:hover { background: var(--bg-tertiary); }
  .grade-badge {
    display: inline-block; padding: 4px 12px;
    border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  /* Error State */
  .error-state {
    background: var(--card-bg);
    border: 1px solid var(--accent-red);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .error-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
  .error-retry {
    margin-top: 16px;
    padding: 8px 20px;
    background: var(--accent-blue);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 50px; color: var(--text-secondary);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border-color);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Footer */
  .footer {
    text-align: center; padding: 24px;
    color: var(--text-muted); font-size: 13px;
    border-top: 1px solid var(--border-color);
    margin-top: 30px;
  }
  /* Responsive - Tablet & Mobile */
  @media (max-width: 1024px) {
    .container { padding: 20px; }
    .header { padding: 12px 20px; }
    .chart-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .container { padding: 14px; }
    .header {
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    .logo { width: 36px; height: 36px; font-size: 18px; border-radius: 9px; }
    .header-left { gap: 10px; }
    .header-title { font-size: 15px; }
    .header-subtitle { display: none; }
    .header-right { gap: 8px; }
    .icon-btn { width: 36px; height: 36px; font-size: 16px; }
    .report-info-bar {
      padding: 10px 12px;
      font-size: 12px;
      gap: 10px;
      margin-bottom: 14px;
    }
    .report-info-spacer { display: none; }
    .report-info-text:last-child { width: 100%; border-top: 1px solid var(--border-color); padding-top: 8px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-value { font-size: 22px; }
    .chart-container { height: 250px; }
    .ai-section { padding: 16px; }
    .quality-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 380px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .quality-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body data-theme="dark">

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">📊</div>
    <div>
      <div class="header-title">51.LA 流量趋势分析 · AI 报告</div>
      <div class="header-subtitle">AI 生成 · 静态部署</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="refreshBtn" title="刷新数据">🔄</button>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
  </div>
</div>

<div class="container">
  <div id="mainContent">
    <div class="loading">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>
  </div>

  <div class="footer">
    51.LA Analytics · AI 报告系统 | 数据由外部 AI 生成 · 静态部署
  </div>
</div>

<script>
// ========== 全局状态 ==========
const STATE = {
  reportData: null,
  currentSite: 'overview',
  currentMetric: 'both',
  trendChart: null,
  pieChart: null
};

// ========== 工具函数 ==========
function $(id) { return document.getElementById(id); }

function formatNumber(n) {
  if (n == null || isNaN(n)) return '--';
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return Math.round(n).toLocaleString();
}

function formatPercent(p) {
  if (p == null || isNaN(p)) return '--';
  return p.toFixed(1) + '%';
}

function formatDuration(sec) {
  if (!sec || sec <= 0) return '--';
  if (sec < 60) return Math.round(sec) + 's';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + 'm' + (s > 0 ? s + 's' : '');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function formatDateTime(isoStr) {
  if (!isoStr) return '--';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  return d.getFullYear() + '/' + 
    String(d.getMonth() + 1).padStart(2, '0') + '/' + 
    String(d.getDate()).padStart(2, '0') + ' ' +
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0') + ':' +
    String(d.getSeconds()).padStart(2, '0');
}

function getTimeAgo(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  const diff = Date.now() - d.getTime();
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);
  if (days > 0) return days + ' 天前更新';
  if (hours > 0) return hours + ' 小时前更新';
  const mins = Math.floor(diff / (1000 * 60));
  if (mins > 0) return mins + ' 分钟前更新';
  return '刚刚更新';
}

function getDataFreshness(isoStr) {
  if (!isoStr) return 'expired';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return 'expired';
  const diffHours = (Date.now() - d.getTime()) / (1000 * 60 * 60);
  if (diffHours <= 24) return 'fresh';
  if (diffHours <= 72) return 'stale';
  return 'expired';
}

function getGradeLevel(grade) {
  if (!grade) return 'level-poor';
  const g = grade.toLowerCase();
  if (g.includes('优秀') || g.includes('excellent')) return 'level-excellent';
  if (g.includes('良好') || g.includes('good')) return 'level-good';
  if (g.includes('一般') || g.includes('normal') || g.includes('medium')) return 'level-normal';
  return 'level-poor';
}

function getQualityLevel(value, type) {
  if (value == null || isNaN(value)) return { level: '--', cls: '' };
  if (type === 'bounceRate') {
    if (value <= 40) return { level: '理想', cls: 'level-excellent' };
    if (value <= 60) return { level: '良好', cls: 'level-good' };
    if (value <= 80) return { level: '偏高', cls: 'level-normal' };
    return { level: '很高', cls: 'level-poor' };
  }
  if (type === 'avgDuration') {
    if (value >= 180) return { level: '很长', cls: 'level-excellent' };
    if (value >= 60) return { level: '正常', cls: 'level-good' };
    if (value >= 30) return { level: '偏短', cls: 'level-normal' };
    return { level: '很短', cls: 'level-poor' };
  }
  if (type === 'pvPerUv') {
    if (value >= 5) return { level: '很高', cls: 'level-excellent' };
    if (value >= 3) return { level: '良好', cls: 'level-good' };
    if (value >= 1.5) return { level: '一般', cls: 'level-normal' };
    return { level: '偏低', cls: 'level-poor' };
  }
  return { level: '--', cls: '' };
}

// ========== 数据加载 ==========
async function loadReportData() {
  try {
    const res = await fetch('data/report.json?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    
    // 数据校验
    if (!data || !data.sites || !Array.isArray(data.sites) || data.sites.length === 0) {
      throw new Error('报告数据格式不正确或站点列表为空');
    }
    
    // 预处理数据：确保每个站点都有必要的字段
    data.sites = data.sites.map(site => normalizeSiteData(site));
    
    // 计算是否有 AI 分析
    data._hasAI = data.sites.some(s => s.aiReport && (s.aiReport.summary || s.aiReport.keyFindings || s.aiReport.recommendations));
    data._hasOverallAI = !!(data.overallAI && (data.overallAI.executiveSummary || data.overallAI.crossSiteComparison || data.overallAI.strategicRecommendations));
    
    return data;
  } catch (e) {
    console.error('加载报告数据失败:', e);
    throw e;
  }
}

function normalizeSiteData(site) {
  // 确保所有必要字段都存在，避免前端崩溃
  const s = { ...site };
  s.today = s.today || {};
  s.yesterday = s.yesterday || {};
  s.compare = s.compare || {};
  s.cumulative = s.cumulative || {};
  s.quality = s.quality || {};
  s.trend = s.trend || {};
  s.history = Array.isArray(s.history) ? s.history : [];
  
  // 确保 today 有默认值
  const defaults = { uv: 0, pv: 0, sv: 0, ip: 0, newUser: 0, bounceRate: 0, avgDuration: 0, pvPerUv: 0 };
  s.today = { ...defaults, ...s.today };
  s.yesterday = { ...defaults, ...s.yesterday };
  
  return s;
}

function renderSiteTabs(data) {
  const tabs = $('siteTabs');
  const sites = data.sites || [];
  
  let html = `<button class="site-tab ${STATE.currentSite === 'overview' ? 'active' : ''}" data-site="overview">📊 总览</button>`;
  
  sites.forEach(site => {
    const grade = site.quality ? getOverallGrade(site) : '';
    html += `<button class="site-tab ${STATE.currentSite === site.name ? 'active' : ''}" data-site="${site.name}">${site.name} <span style="font-size:11px;opacity:0.7;">${grade}</span></button>`;
  });
  
  tabs.innerHTML = html;
}

function getOverallGrade(site) {
  // 简单的质量评级逻辑
  const q = site.quality || {};
  const bounceRate = q.bounceRate?.value ?? 100;
  const avgDuration = q.avgDuration?.value ?? 0;
  const pvPerUv = q.pvPerUv?.value ?? 0;
  
  let score = 0;
  if (bounceRate <= 40) score += 3;
  else if (bounceRate <= 60) score += 2;
  else if (bounceRate <= 80) score += 1;
  
  if (avgDuration >= 180) score += 3;
  else if (avgDuration >= 60) score += 2;
  else if (avgDuration >= 30) score += 1;
  
  if (pvPerUv >= 5) score += 3;
  else if (pvPerUv >= 3) score += 2;
  else if (pvPerUv >= 1.5) score += 1;
  
  if (score >= 7) return '优秀';
  if (score >= 5) return '良好';
  if (score >= 3) return '一般';
  return '待优化';
}

function renderChart(data) {
  const sites = data.sites || [];

  const pieCtx = document.getElementById('pieChart');
  
  if (!ctx || !pieCtx) return;
  
  // 收集所有日期
  const allDates = new Set();
  sites.forEach(site => {
    (site.history || []).forEach(h => allDates.add(h.date));
  });
  const dates = Array.from(allDates).sort();
  
  const colors = [
    { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)' },
    { border: '#22c55e', bg: 'rgba(34, 197, 94, 0.1)' },
    { border: '#a855f7', bg: 'rgba(168, 85, 247, 0.1)' },
    { border: '#f97316', bg: 'rgba(249, 115, 22, 0.1)' },
    { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.1)' }
  ];
  
  // 趋势图
  let datasets = [];
  
  if (STATE.currentSite === 'overview') {
    // 总览：显示每个站点的趋势
    if (STATE.currentMetric === 'uv' || STATE.currentMetric === 'both') {
      sites.forEach((site, i) => {
        const color = colors[i % colors.length];
        datasets.push({
          label: site.name + ' UV',
          data: dates.map(d => {
            const h = site.history?.find(x => x.date === d);
            return h?.uv ?? 0;
          }),
          borderColor: color.border,
          backgroundColor: color.bg,
          tension: 0.3,
          fill: STATE.currentMetric === 'uv'
        });
      });
    }
    if (STATE.currentMetric === 'pv' || STATE.currentMetric === 'both') {
      sites.forEach((site, i) => {
        const color = colors[(i + sites.length) % colors.length];
        datasets.push({
          label: site.name + ' PV',
          data: dates.map(d => {
            const h = site.history?.find(x => x.date === d);
            return h?.pv ?? 0;
          }),
          borderColor: color.border,
          backgroundColor: color.bg,
          borderDash: [5, 5],
          tension: 0.3,
          fill: STATE.currentMetric === 'pv'

      });

        });

      </div>
      <div class="quality-item">
        <div class="quality-label">平均访问时长</div>
        <div class="quality-value">${formatDuration(site.today?.avgDuration)}</div>
        <span class="quality-level ${durationQ.cls}">${durationQ.level}</span>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
          昨日 ${formatDuration(site.yesterday?.avgDuration)}
        </div>
      </div>
      <div class="quality-item">
        <div class="quality-label">人均浏览页数</div>
        <div class="quality-value">${(site.today?.pvPerUv || 0).toFixed(2)}</div>
        <span class="quality-level ${pvQ.cls}">${pvQ.level}</span>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
          昨日 ${(site.yesterday?.pvPerUv || 0).toFixed(2)}
        </div>
      </div>
    `;
  }
}

function getQualityLevelClass(level) {
  if (!level) return '';
  const l = level.toLowerCase();
  if (l.includes('理想') || l.includes('优秀') || l.includes('很高') || l.includes('很长')) return 'level-excellent';
  if (l.includes('良好') || l.includes('正常')) return 'level-good';
  if (l.includes('一般') || l.includes('偏高') || l.includes('偏短') || l.includes('偏低')) return 'level-normal';
  return 'level-poor';
}

// ========== AI 分析渲染 ==========
function renderAI() {
  const container = $('aiContent');
  const data = STATE.reportData;
  if (!container || !data) return;
  
  if (STATE.currentSite === 'overview') {
    renderOverviewAI(container, data);
  } else {
    renderSiteAI(container, data);
  }
}

function renderOverviewAI(container, data) {
  const overall = data.overallAI || {};
  const hasOverallAI = overall && (overall.executiveSummary || overall.crossSiteComparison || overall.strategicRecommendations);
  
  if (!hasOverallAI) {
    const hasAnyAI = data._hasAI;
    container.innerHTML = `
      <div class="ai-summary">
        📊 总览数据已加载，包含 ${data.sites.length} 个站点的流量统计。
      </div>
      <div style="background: var(--bg-tertiary); border-radius: 10px; padding: 24px; text-align: center;">
        <div style="font-size: 42px; margin-bottom: 14px;">⏳🤖</div>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 10px;">总览 AI 分析待生成</div>
        <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.8; max-width: 500px; margin: 0 auto;">
          流量统计数据已正常加载，但 AI 智能分析报告尚未生成。<br>
          ${hasAnyAI ? '部分站点已有 AI 分析，点击站点标签查看详情。' : '所有站点的 AI 分析均待生成。'}
        </div>
        <div style="margin-top: 16px; padding: 12px 16px; background: var(--card-bg); border-radius: 8px; font-size: 12px; color: var(--text-muted); display: inline-block; text-align: left;">
          <div style="margin-bottom: 6px; font-weight: 600; color: var(--text-secondary);">💡 AI 生成流程：</div>
          <div>1. 调用导出 API 获取 <code style="background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-size: 11px;">format=report</code> 格式数据</div>
          <div>2. AI 分析数据，生成 <code style="background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-size: 11px;">overallAI</code> 和各站点 <code style="background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-size: 11px;">aiReport</code></div>
          <div>3. 推送 report.json 到仓库，自动部署更新网站</div>
        </div>
      </div>
    `;
    return;
  }
  
  // 有 AI 数据，渲染完整分析
  const comparison = overall.crossSiteComparison || {};
  const strategies = overall.strategicRecommendations || [];
  
  let comparisonHtml = '';
  if (comparison.comparisonItems && comparison.comparisonItems.length > 0) {
    comparisonHtml = '<table class="comparison-table"><thead><tr><th>指标</th><th>领先</th><th>落后</th><th>分析</th></tr></thead><tbody>';
    comparison.comparisonItems.forEach(item => {
      comparisonHtml += `
        <tr>
          <td><strong>${item.metric}</strong></td>
          <td>${item.leader} <span style="color:var(--text-muted);font-size:12px;">${item.leaderValue}</span></td>
          <td>${item.follower || '--'} <span style="color:var(--text-muted);font-size:12px;">${item.followerValue || ''}</span></td>
          <td style="font-size:13px;color:var(--text-secondary);">${item.analysis || ''}</td>
        </tr>
      `;
    });
    comparisonHtml += '</tbody></table>';
  } else {
    comparisonHtml = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">暂无对比数据</div>';
  }
  
  let strategyHtml = '';
  if (strategies.length > 0) {
    strategyHtml = strategies.map(s => `
      <div class="strategy-card">
        <div class="strategy-header">
          <div class="strategy-target">🎯 ${s.target}</div>
          <span class="strategy-type">${s.type || '策略'}</span>
        </div>
        <div class="strategy-focus">${s.focus || ''}</div>
        <ul class="strategy-actions">
          ${(s.actions || []).map(a => `<li>${a}</li>`).join('')}
        </ul>
      </div>
    `).join('');
  } else {
    strategyHtml = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">暂无战略建议</div>';
  }
  
  container.innerHTML = `
    <div class="ai-summary">${overall.executiveSummary || '暂无总览分析'}</div>
    
    <div class="ai-tabs">
      <div class="ai-tab active" data-tab="comparison">📊 横向对比</div>
      <div class="ai-tab" data-tab="strategy">🎯 战略建议</div>
    </div>
    
    <div class="ai-panel active" id="panel-comparison">
      ${comparisonHtml}
    </div>
    
    <div class="ai-panel" id="panel-strategy">
      ${strategyHtml}
    </div>
  `;
  
  bindAiTabs(container);
}

function renderSiteAI(container, data) {
  const site = data.sites.find(s => s.name === STATE.currentSite);
  const ai = site?.aiReport;
  const hasAI = ai && (ai.summary || ai.keyFindings || ai.recommendations);
  
  if (!hasAI) {
    const historyDays = (site?.history || []).length;
    container.innerHTML = `
      <div class="ai-summary">
        📊 <strong>${site?.name || '站点'}</strong> 的流量数据已就绪，共 ${historyDays} 天历史记录。
      </div>
      <div style="background: var(--bg-tertiary); border-radius: 10px; padding: 24px; text-align: center;">
        <div style="font-size: 42px; margin-bottom: 14px;">🤖⏳</div>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 10px;">AI 分析待生成</div>
        <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.8; max-width: 500px; margin: 0 auto;">
          流量统计数据已加载，但 AI 分析报告尚未生成。<br>
          数据采集正常运行，等待 AI 分析生成后推送即可显示。
        </div>
        <div style="margin-top: 16px; padding: 12px 16px; background: var(--card-bg); border-radius: 8px; font-size: 12px; color: var(--text-muted); display: inline-block; text-align: left;">
          <div style="margin-bottom: 6px; font-weight: 600; color: var(--text-secondary);">💡 AI 生成流程：</div>
          <div>1. 调用导出 API：<code style="background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-size: 11px;">?format=report&days=14</code></div>
          <div>2. AI 生成分析报告，添加 aiReport 字段</div>
          <div>3. 推送 report.json 到仓库，自动更新网站</div>
        </div>
      </div>
    `;
    return;
  }
  
  // 有 AI 数据
  const findingsHtml = (ai.keyFindings || []).map(f => `
    <div class="finding-card">
      <div class="finding-icon">${f.icon || '💡'}</div>
      <div class="finding-text">${f.text || f}</div>
    </div>
  `).join('');
  
  const recsHtml = (ai.recommendations || []).map(r => `
    <div class="rec-item type-${r.type || 'info'}">
      <div class="rec-icon">${getTypeIcon(r.type)}</div>
      <div style="flex: 1;">
        <div class="rec-title">
          ${r.title}
          ${r.priority ? `<span class="rec-priority ${r.priority}">${priorityLabel(r.priority)}</span>` : ''}
        </div>
        <div class="rec-detail">${r.detail}</div>
      </div>
    </div>
  `).join('');
  
  const deep = ai.deepAnalysis || {};
  const actionPlan = deep.actionPlan || [];
  const riskPoints = deep.riskPoints || [];
  
  let deepHtml = '';
  if (actionPlan.length > 0 || riskPoints.length > 0) {
    deepHtml = `
      <div class="deep-grid">
        ${actionPlan.length > 0 ? `
        <div class="deep-card">
          <div class="deep-card-title">📋 行动计划</div>
          <ul class="action-list">
            ${actionPlan.map(a => `<li><span class="action-phase">${a.phase}</span><span>${a.action}</span></li>`).join('')}
          </ul>
        </div>
        ` : ''}
        ${riskPoints.length > 0 ? `
        <div class="deep-card">
          <div class="deep-card-title">⚠️ 风险与机遇</div>
          <ul class="risk-list">
            ${riskPoints.map(r => `<li><span class="risk-icon">${r.icon || '⚠️'}</span><span>${r.text || r}</span></li>`).join('')}
          </ul>
        </div>
        ` : ''}
      </div>
    `;
  }
  
  const outlookHtml = ai.outlook ? `
    <div class="ai-outlook">
      <div class="outlook-label">🔮 趋势展望</div>
      <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.7;">${ai.outlook}</div>
    </div>
  ` : '';
  
  container.innerHTML = `
    <div class="ai-summary">${ai.summary || ''}</div>
    
    <div class="ai-findings">${findingsHtml}</div>
    
    <div class="ai-tabs">
      <div class="ai-tab active" data-tab="recommendations">💡 优化建议</div>
      ${deepHtml ? '<div class="ai-tab" data-tab="deep">🔍 深度分析</div>' : ''}
      ${outlookHtml ? '<div class="ai-tab" data-tab="outlook">🔮 趋势展望</div>' : ''}
    </div>
    
    <div class="ai-panel active" id="panel-recommendations">
      ${recsHtml || '<div style="color: var(--text-muted);">暂无建议</div>'}
    </div>
    
    ${deepHtml ? `<div class="ai-panel" id="panel-deep">${deepHtml}</div>` : ''}
    ${outlookHtml ? `<div class="ai-panel" id="panel-outlook">${outlookHtml}</div>` : ''}
  `;
  
  bindAiTabs(container);
}

function getTypeIcon(type) {
  const icons = {
    success: '✅',
    warning: '⚠️',
    alert: '🚨',
    info: '💡'
  };
  return icons[type] || '💡';
}

function priorityLabel(priority) {
  const labels = { high: '高优先', medium: '中优先', low: '低优先' };
  return labels[priority] || priority;
}

function bindAiTabs(container) {
  const tabs = container.querySelectorAll('.ai-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const tabName = tab.dataset.tab;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      
      const panels = container.querySelectorAll('.ai-panel');
      panels.forEach(p => p.classList.remove('active'));
      
      const targetPanel = container.querySelector('#panel-' + tabName);
      if (targetPanel) targetPanel.classList.add('active');
    });
  });
}

function renderComparison(data) {
  const table = $('comparisonTable');
  if (!table) return;
  
  const sites = data.sites || [];
  if (sites.length < 2) return;
  
  let html = `
    <thead>
      <tr>
        <th>站点</th>
        <th>今日 UV</th>
        <th>今日 PV</th>
        <th>UV 变化</th>
        <th>PV 变化</th>
        <th>跳出率</th>
        <th>人均页数</th>
        <th>质量评级</th>
      </tr>
    </thead>
    <tbody>
  `;
  
  sites.forEach(site => {
    const t = site.today || {};
    const c = site.compare || {};
    const grade = getOverallGrade(site);
    const gradeCls = getGradeLevel(grade);
    
    html += `
      <tr>
        <td><strong>${site.name}</strong></td>
        <td>${formatNumber(t.uv)}</td>
        <td>${formatNumber(t.pv)}</td>
        <td class="${c.uvChange >= 0 ? 'stat-change up' : 'stat-change down'}" style="display:inline-flex;">
          ${c.uvChange >= 0 ? '↑' : '↓'} ${Math.abs(c.uvChange || 0).toFixed(2)}%
        </td>
        <td class="${c.pvChange >= 0 ? 'stat-change up' : 'stat-change down'}" style="display:inline-flex;">
          ${c.pvChange >= 0 ? '↑' : '↓'} ${Math.abs(c.pvChange || 0).toFixed(2)}%
        </td>
        <td>${formatPercent(t.bounceRate)}</td>
        <td>${(t.pvPerUv || 0).toFixed(2)}</td>
        <td><span class="grade-badge ${gradeCls}">${grade}</span></td>
      </tr>
    `;
  });
  
  html += '</tbody>';
  table.innerHTML = html;
}

// ========== 事件绑定 ==========
function bindSiteTabs() {
  const tabs = document.querySelectorAll('.site-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      STATE.currentSite = tab.dataset.site;
      render();
    });
  });
}

function bindMetricToggle() {
  const btns = document.querySelectorAll('.metric-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.currentMetric = btn.dataset.metric;
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChart(STATE.reportData);
    });
  });
}

// ========== 主题切换 ==========
function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) {
    document.body.dataset.theme = saved;
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.dataset.theme = 'light';
  }
  updateThemeIcon();
}

function toggleTheme() {
  const current = document.body.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = next;
  localStorage.setItem('theme', next);
  updateThemeIcon();
  
  // 重新渲染图表（颜色可能变化）
  if (STATE.trendChart) {
    STATE.trendChart.destroy();
    STATE.trendChart = null;
  }
  if (STATE.pieChart) {
    STATE.pieChart.destroy();
    STATE.pieChart = null;
  }
  if (STATE.reportData) {
    renderChart(STATE.reportData);
  }
}

function updateThemeIcon() {
  const btn = $('themeBtn');
  if (btn) {
    btn.textContent = document.body.dataset.theme === 'dark' ? '🌙' : '☀️';
  }
}

// ========== 错误处理 ==========
function renderError(error) {
  $('mainContent').innerHTML = `
    <div class="error-state">
      <div class="error-icon">❌</div>
      <div class="error-title">数据加载失败</div>
      <div class="error-detail">
        ${error.message || '未知错误'}<br>
        请检查 report.json 是否存在且格式正确。
      </div>
      <button class="error-retry" onclick="init()">🔄 重新加载</button>
    </div>
  `;
}

// ========== 初始化 ==========
async function init() {
  $('mainContent').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>
  `;
  
  try {
    STATE.reportData = await loadReportData();
    render();
  } catch (e) {
    console.error('初始化失败:', e);
    renderError(e);
  }
}

// 事件绑定
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  
  $('themeBtn')?.addEventListener('click', toggleTheme);
  $('refreshBtn')?.addEventListener('click', init);
  
  init();
});
</script>

</body>
</html>
